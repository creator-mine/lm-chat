# LM Chat relay behind nginx.
#
# Install as /etc/nginx/conf.d/lm-relay.conf and replace lm.example.com.
# The relay listens on 127.0.0.1:8787 and terminates TLS here.
#
# For an IP-only setup use a self-signed certificate with an IP SAN and pin it
# in the app; see tools/lm-relay/README.md.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# $uri excludes the query string. File paths may appear in ?path=..., so they
# must not end up in the access log.
log_format lm_relay '$remote_addr $status $request_method $uri '
                    '$body_bytes_sent $request_time';

server {
    listen 443 ssl;
    # nginx < 1.25: listen 443 ssl http2;
    http2 on;
    server_name lm.example.com;

    ssl_certificate     /etc/letsencrypt/live/lm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;
    client_body_timeout 120s;

    access_log /var/log/nginx/lm-relay.log lm_relay;

    # The agent's outbound WebSocket. Must not be buffered or timed out while
    # the connection is idle.
    location /_tunnel {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HTTP requests from the app. SSE must reach the phone as it is produced.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;

        # A model load or a long tool call can stay silent for many minutes.
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;

        gzip off;
    }
}
