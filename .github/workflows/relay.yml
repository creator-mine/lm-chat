name: Relay

on:
  push:
    branches: ["**"]
    paths:
      - "tools/lm-relay/**"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "tools/lm-relay/**"
      - ".github/workflows/relay.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/lm-relay
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24"
          cache-dependency-path: tools/lm-relay/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
